services:
  productdb:
    image: mongo:7.0.5
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${DB_NAME:-productdb}
    volumes:
      - ./productdb:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--username", "${DB_ROOT_USER:-admin}", "--password", "${DB_ROOT_PASSWORD:-admin123}", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  om-product:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - productdb
    environment:
      DB_ROOT_USER: ${DB_ROOT_USER:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-productdb}
      SPRING_DATA_MONGODB_URI: mongodb://${DB_ROOT_USER:-admin}:${DB_ROOT_PASSWORD:-admin123}@productdb:27017/${DB_NAME:-productdb}?authSource=admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8090:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_ROOT_PASSWORD:-admin123}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_ROOT_USER:-admin}:${DB_ROOT_PASSWORD:-admin123}@productdb:27017/
      ME_CONFIG_BASICAUTH: true
    depends_on:
      - productdb
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
